name: "AI Multi-Agent Pull Request Reviewer & Invariant Gate"

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  # Job 1: Deterministic Architectural & Security Invariant Gate
  invariant-gate:
    name: "Architectural & Security Invariant Gate"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pydantic Validator
        run: python -m pip install pydantic

      - name: Extract PR Diff
        id: pr-diff
        run: |
          git diff origin/${{ github.base_ref }}...HEAD > pr_diff.patch
          # Cap patch size to 2500 lines to preserve token bounds
          head -n 2500 pr_diff.patch > pr_diff_bounded.patch

      - name: Execute Invariant Review Bot
        run: |
          python 08-ai-augmented-sdlc-and-leadership/examples/ai_pr_reviewer.py --diff pr_diff_bounded.patch

  # Job 2: Headless Agent Reviewer (Claude Code Action)
  claude-code-review:
    name: "Headless Claude Code Review"
    runs-on: ubuntu-latest
    needs: [invariant-gate]
    if: success() && env.ANTHROPIC_API_KEY != ''
    timeout-minutes: 10
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Headless Claude Code PR Review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            You are a Principal Software Architect enforcing the Builder-Validator Chain.
            Audit this pull request against AGENT.md invariants.
            Focus strictly on business logic correctness, race conditions, and unhandled edge cases.
            Skip trivial formatting and style nits.
          claude_args: "--max-turns 3 --bare --allowedTools 'Read,Bash'"
